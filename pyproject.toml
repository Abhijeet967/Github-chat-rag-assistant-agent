[tool.poetry]
name = "rag-assistant-agent"
version = "1.0.0"
description = "RAG Assistant - Chat with any GitHub repository using uAgents ChatProtocol and Fetch.ai ASI:One"
authors = ["Your Team <team@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
uagents = "^0.15.0"
requests = "^2.31.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
chromadb = "^0.3.21"
beautifulsoup4 = "^4.12.0"
PyYAML = "^6.0"
openai = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
